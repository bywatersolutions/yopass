version: "3.8"

services:
  memcached:
    image: memcached
    restart: always
    expose:
      - "11211"

  yopass:
    image: yopass
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - MEMCACHED=memcached:11211
      - PORT=3000
      - BRAND_TITLE=Sharepass - ByWater Solutions
      - BRAND_COLOR=#87c0e9
      - BRAND_LOGO=https://ik.imagekit.io/bywatersolutions/icon_only_transparent.png
      - DEFAULT_EXPIRY=1w
    healthcheck:
      test: ["CMD", "/yopass-server", "--health-check"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
