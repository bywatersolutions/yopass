# Sharepass (ByWater's Yopass fork) on the prod-bwsdocker01 Docker Swarm.
#
#   docker stack deploy -c deploy/docker-swarm/yopass-stack.yml yopass
#
# Source of truth for the production "yopass" stack (previously defined in
# Portainer). The image is built by .github/workflows/bws-build.yml; :latest
# always follows the fork's master (newest upstream release + our
# customizations) and the host's shepherd rolls it out automatically. To freeze
# a release, pin the image to a version tag (e.g. :15.1.0).
#
# The host's shepherd only updates services labelled shepherd.enable=true, when
# their image tag gets a new digest; diun alerts #enterprise-container-updates
# about every other service. Secrets live in Redis with persistence on a
# volume, so an automatic restart costs at most ~1s of writes instead of wiping
# every secret, as it did with memcached.
version: "3.8"

services:
  redis:
    # Docker Hub's official image, served by Google's mirror, which has no pull
    # limit (the host once ran out of anonymous Docker Hub pulls and could not
    # start Redis). Minor version pinned: shepherd applies 8.10 patch releases.
    image: mirror.gcr.io/library/redis:8.10-alpine
    # AOF with fsync every second is what makes restarts safe; the RDB save
    # points (Redis's defaults, spelled out) add compact snapshots for backups.
    # Only ciphertext is stored: yopass encrypts in the browser.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - 3600 1 300 100 60 10000
    volumes:
      - redis-data:/data
    networks:
      - yopass-tier
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Time to finish the final AOF fsync / RDB save on shutdown.
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        # Two Redis processes must never share the data volume.
        order: stop-first
      placement:
        constraints:
          # The data volume is local to this node.
          - node.hostname == prod-bwsdocker01
      labels:
        shepherd.enable: "true"
        diun.enable: "false"

  yopass:
    image: quay.io/bywatersolutions/yopass:latest
    environment:
      - DATABASE=redis
      - REDIS=redis://redis:6379/0
      - PORT=3000
      - BRAND_TITLE=Sharepass - ByWater Solutions
      - BRAND_COLOR=#1b4c81
      - 'BRAND_THEME_LIGHT={"--color-primary":"#1b4c81","--color-primary-content":"#ffffff","--color-secondary":"#63b7e6","--color-secondary-content":"#0f2a47","--color-accent":"#46d2a8","--color-accent-content":"#0b3b2e","--color-neutral":"#1e324d","--color-neutral-content":"#ffffff","--color-base-100":"#ffffff","--color-base-200":"#f3f3f3","--color-base-300":"#dfe6ee","--color-base-content":"#1e2122","--color-info":"#63b7e6","--color-info-content":"#0f2a47","--color-success":"#46d2a8","--color-success-content":"#0b3b2e"}'
      - 'BRAND_THEME_DARK={"--color-primary":"#63b7e6","--color-primary-content":"#0f2a47","--color-secondary":"#46d2a8","--color-secondary-content":"#0b3b2e","--color-accent":"#63b7e6","--color-accent-content":"#0f2a47","--color-neutral":"#0f2a47","--color-neutral-content":"#e6eef7","--color-base-100":"#1e324d","--color-base-200":"#16283d","--color-base-300":"#2c4669","--color-base-content":"#e6eef7","--color-info":"#63b7e6","--color-info-content":"#0f2a47","--color-success":"#46d2a8","--color-success-content":"#0b3b2e"}'
      - BRAND_LOGO=https://ik.imagekit.io/bywatersolutions/icon_only_transparent.png
      - DEFAULT_EXPIRY=1w
      - DISABLE_FEATURES=true
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    networks:
      - traefik-public
      - yopass-tier
    healthcheck:
      test: ["CMD", "/yopass-server", "--health-check"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: stop-first
      labels:
        traefik.enable: "true"
        traefik.constraint-label: traefik-public
        traefik.http.routers.yopass.entrypoints: http
        traefik.http.routers.yopass.rule: "Host(`sharepass.tools.bywatersolutions.com`)"
        traefik.http.routers.yopass.service: yopass
        traefik.http.services.yopass.loadbalancer.server.port: "3000"
        shepherd.enable: "true"
        diun.enable: "false"

volumes:
  redis-data: {}

networks:
  traefik-public:
    external: true
  yopass-tier:
    driver: overlay
